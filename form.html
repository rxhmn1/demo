<html>
    <head>
        <script>
            function validate(){
                var name=document.getElementById("name").value;
                var rollno=document.getElementById("rollno").value;
                var branch=document.getElementById("branch").value;
                var email=document.getElementById("email").value;
                var mno=document.getElementById("mno").value;
                var age=document.getElementById("age").value;

                if(name==""||rollno==""||branch==""||email==""||mno==""||age==""){
                    alert("Please enter all the details"); return false;
                }
                if(email.indexOf("@")==-1 || email.indexOf(".")==-1){
                    alert("enter valid email"); return false;
                }
                if(mno.length!=10 || isNaN(mno)){
                    alert("enter a valid mobile number"); return false;
                }
                alert("Registration Successful");
                return true;
            }
        </script>
        <style>
            *{
                padding:5px;
                margin:5px;
                font-family: Arial;
                text-align: center;
            }
            form{
                margin:auto;
                width:320px;
                border:solid;
                background:#f9f9f9;
            }
            input[type="submit"]{background: blue; color:white;}
            input[type="reset"]{background:red; color:white;}
        </style>
    </head>
    <body>
        <h1>Registration Form</h1>
        <form onsubmit="return validate()">
            Name:<input type="text" id="name"><br>
            RollNo:<input type="text" id="rollno"><br>
            Branch:<input type="text" id="branch"><br>
            Email:<input type="email" id="email"><br>
            Mobile Number:<input type="text" id="mno"><br>
	    Alternate Mno:<input type="text" id""ano"><br>
            Age:<input type="text" id="age"><br>
            <input type="submit" value="register">
            <input type="reset" value="reset">
        </form>
    </body>
</html>
